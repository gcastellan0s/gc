version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 20
        - corepack enable
        - corepack prepare yarn@stable --activate
        - yarn install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - corepack enable
        - corepack prepare yarn@stable --activate
        - yarn install
    build:
      commands:
        - npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH
        - yarn build
  artifacts:
    baseDirectory: .output
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
